<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Robô - Nível 5</title>
    <link rel="stylesheet" href="nv5.css">
</head>

<body>
    <main class="jogo">

        <header class="topo">
            <h1>🤖 Robô - Nível 5</h1>
            <p>Dica: sempre que houver um buraco à frente, vire à direita 🕳️↪️</p>
        </header>

        <section class="palco">
            <canvas id="tabuleiro" width="560" height="430" aria-label="Tabuleiro isométrico 3D"></canvas>
        </section>

        <aside class="painel">

            <div class="editor">

                <!-- Comandos: arraste para a área "Programa" -->
                <div class="paleta">
                    <h2>Comandos</h2>
                    <div class="botoes">
                        <button class="cmd cmd-frente" data-comando="frente"><span>⬆️</span>Frente</button>
                        <button class="cmd cmd-esquerda" data-comando="esquerda"><span>↩️</span>Esquerda</button>
                        <button class="cmd cmd-direita" data-comando="direita"><span>↪️</span>Direita</button>
                        <button class="cmd cmd-acender" data-comando="acender"><span>💡</span>Acender</button>
                    </div>

                    <h2 class="sub">Repetição</h2>
                    <div class="loops dois">
                        <button class="loop" data-comando="repetirAte">🔁 Até 💡</button>
                        <button class="loop" data-comando="fimRepetir">🛑 Fim Repetir</button>
                    </div>

                    <h2 class="sub">Condição</h2>
                    <div class="loops dois">
                        <button class="cond" data-comando="seBuraco">❓ Se 🕳️ à frente</button>
                        <button class="cond" data-comando="fimSe">🛑 Fim Se</button>
                    </div>
                </div>

                <!-- Programa: um comando embaixo do outro -->
                <div class="coluna-programa">
                    <h2>Programa</h2>
                    <div id="programa" aria-label="Programa: solte os comandos aqui"></div>
                </div>

            </div>

            <div class="controles">
                <button class="exec" onclick="executar()">▶ Executar</button>
                <button class="sec" onclick="removerUltimo()">⌫ Remover último</button>
                <button class="sec" onclick="reiniciar()">🔄 Reiniciar</button>
            </div>

            <p id="mensagem"></p>
        </aside>

    </main>

        <!-- Janela de aviso -->
    <div id="aviso" class="aviso-fundo" role="dialog" aria-modal="true" aria-labelledby="aviso-titulo" hidden>
        <div class="aviso-janela">
            <button class="aviso-fechar" onclick="fecharAviso()" aria-label="Fechar">✕</button>
            <h2 id="aviso-titulo"></h2>
            <p id="aviso-texto"></p>
            <button class="aviso-ok" onclick="fecharAviso()">Entendi</button>
        </div>
    </div>

    <!-- Janela de vitória -->
    <div id="vitoria" class="aviso-fundo" role="dialog" aria-modal="true" aria-labelledby="vitoria-titulo" hidden>
        <div class="aviso-janela">
            <button class="aviso-fechar" onclick="fecharVitoria()" aria-label="Fechar">✕</button>
            <h2 id="vitoria-titulo">🎉 Parabéns!</h2>
            <p>Parabéns! Você está quase no final!!</p>
            <a class="aviso-ok" href="../nv6/nv6.html">Próximo nível ➜</a>
        </div>
    </div>

    <script src="nv5.js"></script>
</body>
</html>
